[package]
name = "ssho"
version = "0.1.0"
edition = "2021"
description = "SSH Organizer: a terminal SSH manager based on SSHM, implemented in Rust"
license = "MIT"
rust-version = "1.88"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
glob = "0.3"
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[profile.release]
lto = "thin"
strip = true

[[bin]]
name = "ssho"
path = "src/main.rs"
