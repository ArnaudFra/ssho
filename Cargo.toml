[package]
name = "ssho"
version = "0.1.0"
edition = "2021"
description = "SSH Organizer: a terminal SSH manager based on SSHM, implemented in Rust"
license = "MIT"
rust-version = "1.88"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
crossterm = "0.29"
glob = "0.3.4"
libc = "0.2"
ratatui = "0.30"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
libz-sys = { version = "1", features = ["static"] }
tempfile = "3"
unicode-width = "0.2"
unicode-segmentation = "1.13"
similar = "3"

# libssh2 is built with a vendored OpenSSL on Unix and with the system
# cryptography (WinCNG) on Windows.
[target.'cfg(unix)'.dependencies]
ssh2 = { version = "0.9", features = ["vendored-openssl"] }

[target.'cfg(windows)'.dependencies]
ssh2 = "0.9"
[profile.release]
lto = "thin"
strip = true

[[bin]]
name = "ssho"
path = "src/main.rs"
