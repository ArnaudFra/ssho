[package]
name = "ssho"
version = "0.1.0"
edition = "2021"
description = "SSH Organizer: a terminal SSH manager based on SSHM, implemented in Rust"
license = "MIT"
rust-version = "1.88"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
crossterm = "0.28"
glob = "0.3"
libc = "0.2"
ratatui = "0.29"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
ssh2 = { version = "0.9", features = ["vendored-openssl"] }
libz-sys = { version = "1", features = ["static"] }
tempfile = "3"
unicode-width = "0.2"

[profile.release]
lto = "thin"
strip = true

[[bin]]
name = "ssho"
path = "src/main.rs"
