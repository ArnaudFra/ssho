name: Release

# Pushing a version tag (v0.1.0, v0.2.0-rc.1...) builds and tests the four
# archives, then publishes the GitHub release. Nothing else starts this workflow.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: read

concurrency:
  group: rust-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.runner }}
    env:
      TARGET: ${{ matrix.target }}
      # Compiled in: a released binary looks for updates in the repository that
      # released it, never in another project.
      SSHO_REPOSITORY: ${{ github.repository }}
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag must be the version of Cargo.toml
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n '/^\[package\]/,/^\[/s/^version = "\([^"]*\)"$/\1/p' Cargo.toml)
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match version $version of Cargo.toml." >&2
            exit 1
          fi
          printf 'RELEASE_VERSION=%s\n' "$version" >> "$GITHUB_ENV"
      - name: Install the declared minimum Rust toolchain
        run: rustup toolchain install 1.88.0 --profile minimal
      - name: Build native release
        run: cargo +1.88.0 build --release --locked --target "$TARGET"
      - name: Rust tests
        run: cargo +1.88.0 test --locked
      # Keyboard, focus and terminal-restoration journeys in a real pseudo-terminal,
      # with fake SSH tools. Linux only: the scenarios have not been adapted to macOS.
      - name: Pseudo-terminal journeys
        if: runner.os == 'Linux'
        run: sh scripts/pty-checks.sh "target/$TARGET/release/ssho"
      - name: Check distribution scripts
        run: |
          sh -n install.sh
          sh -n scripts/package-release.sh
          python3 tests/distribution.py
      - name: Package and smoke test in temporary HOME
        shell: bash
        run: |
          set -euo pipefail
          sh scripts/package-release.sh --binary "target/$TARGET/release/ssho" \
            --target "$TARGET" --version "$RELEASE_VERSION" --tag "v$RELEASE_VERSION" --output-dir dist
          smoke=$(mktemp -d "$RUNNER_TEMP/sshm-release.XXXXXX")
          trap 'rm -rf "$smoke"' EXIT
          export HOME="$smoke/home"
          mkdir -p "$HOME"
          sh install.sh --archive "dist/ssho-$TARGET.tar.gz" --target "$TARGET" --version "$RELEASE_VERSION"
          test "$("$HOME/.local/bin/ssho" --version)" = "ssho version $RELEASE_VERSION"
          cmp "target/$TARGET/release/ssho" "$HOME/.local/bin/ssho"
          sh install.sh --uninstall
          test ! -e "$HOME/.local/bin/ssho"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          archive: true

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
          digest-mismatch: error
      - name: Validate all assets and publish the release of the tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n '/^\[package\]/,/^\[/s/^version = "\([^"]*\)"$/\1/p' Cargo.toml)
          test "$GITHUB_REF_NAME" = "v$version"
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin; do
            asset="ssho-$target.tar.gz"
            (cd dist && sha256sum --check "$asset.sha256")
            printf 'format=1\nversion=%s\ntarget=%s\n' "$version" "$target" > expected-manifest
            tar -xzOf "dist/$asset" MANIFEST > actual-manifest
            cmp expected-manifest actual-manifest
          done
          set -- dist/*
          test "$#" -eq 8
          if [[ "$version" == *-* ]]; then release_kind=--prerelease; else release_kind=--latest; fi
          gh release create "$GITHUB_REF_NAME" "$@" install.sh LICENSE docs/INSTALLATION.md \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "ssho $version" \
            --generate-notes "$release_kind"
